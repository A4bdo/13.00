<!DOCTYPE html>
<html lang="ar" manifest="cache.appcache">
<head>
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ME4OO PS STORE لخدمات وصيانة البلايستيشن وتنزيل الألعاب</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* تنسيقات إضافية لضمان استقرار واجهة الكاش والأزرار الجديدة بالمنتصف */
        .reset-btn {
            background-color: #ff3333;
            color: white;
            border: none;
            padding: 8px 15px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 10px;
            font-weight: bold;
        }
        .reset-btn:hover { background-color: #cc0000; }
        .status-loading { color: #ffcc00; font-weight: bold; }
        .status-success { color: #25D366; font-weight: bold; }

        /* 🌟 شريط الفحص العلوي الأسود لخاصية الـ Auto Exploit Selection */
        .top-bar {
            background: rgba(14, 17, 22, 0.95);
            border-bottom: 2px solid #ffb703;
            padding: 12px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #ffffff;
            margin: -16px -16px 20px -16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            letter-spacing: 0.5px;
        }

        /* 🎯 محاذاة وتوسيط كافة الأزرار بالملي في منتصف الشاشة بالتنسيق الـ VIP */
        #menu, #social_media, .sub-group {
            text-align: center !important;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .btn {
            display: inline-block;
            margin: 6px auto !important;
            min-width: 280px;
        }

        /* 💛 تصميم وتوهج النيون للزر الأصفر التلقائي الفعال والمستقر */
        .multi-btn {
            background: linear-gradient(135deg, #ffd166 0%, #ffb703 100%) !important;
            color: #0b132b !important;
            font-weight: bold !important;
            border: 2px solid #ffb703 !important;
            box-shadow: 0 0 15px rgba(255, 183, 3, 0.6) !important;
            animation: pulseGlow 1.5s infinite ease-in-out;
        }
        .multi-btn:hover {
            background: linear-gradient(135deg, #ffb703 0%, #ffd166 100%) !important;
            box-shadow: 0 0 25px rgba(255, 183, 3, 0.9) !important;
            transform: scale(1.03);
        }

        /* ⚙️ زر الخيارات المتقدمة والأدوات اليدوية المضيء بلون سماوي نيون */
        .advanced-toggle-btn {
            background: linear-gradient(135deg, #00b4d8 0%, #0077b6 100%) !important;
            color: #ffffff !important;
            font-weight: bold !important;
            border: 2px solid #00f5ff !important;
            box-shadow: 0 0 12px rgba(0, 245, 255, 0.4) !important;
        }
        .advanced-toggle-btn:hover {
            background: linear-gradient(135deg, #00f5ff 0%, #00b4d8 100%) !important;
            box-shadow: 0 0 20px rgba(0, 245, 255, 0.7) !important;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 12px rgba(255, 183, 3, 0.5); }
            50% { box-shadow: 0 0 22px rgba(255, 183, 3, 0.8); }
            100% { box-shadow: 0 0 12px rgba(255, 183, 3, 0.5); }
        }

        /* 🔔 شارة عرض العداد الرقمي التنازلي التلقائي باللون الأصفر */
        .timer-badge {
            background: rgba(255, 183, 3, 0.1) !important;
            border: 1px solid #ffb703 !important;
            color: #ffd166 !important;
            padding: 10px 20px !important;
            border-radius: 8px !important;
            display: inline-block !important;
            font-size: 15px !important;
            font-weight: bold !important;
            margin-top: 10px !important;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8) !important;
        }
    </style>
</head>
<body>
    <!-- 🔔 الشريط العلوي الذكي الفعال للفحص التلقائي -->
    <div id="topBar" class="top-bar">ME4OO PS STORE - (Auto Exploit Selection)</div>

    <h1 id="msgs" style="display:none;">ME4OO PS STORE</h1>
    <h2 id="msgs2" style="text-align: center;">امانه عليك تصلي على حبيبك النبي</h2>
    <div id="cacheStatus" class="status-loading" style="font-size: 16px; margin-top: 5px; text-align: center;">⏳ جاري التحقق من ملفات النظام...</div>
    <br>
    
    <div id="menu">
        <!-- 1️⃣ الزرار الأول: الزر الأصفر العملاق والفعال للفحص والتنشيط التلقائي الفوري للأنظمة -->
        <button class="btn multi-btn" onmouseover="document.getElementById('topBar').innerHTML='PS4 GoldHEN Host - (Auto Exploit Selection)'" onclick="triggerAutoDetect()"> GoldHEN Multi FW </button>
        
        <!-- حاوية عرض إشعار التايمر التنازلي التلقائي للمحل عند تنشيط الفحص -->
        <div id="timerContainer" style="margin-top: 5px; min-height: 45px;"></div>
        <br>

        <!-- 2️⃣ الزرار الثاني الفعال: زر التبديل والتحكم لفتح القائمة اليدوية المخفية -->
        <button class="btn advanced-toggle-btn" onclick="toggleAdvancedMenu()">⚙️ خيارات الأنظمة اليدوية والأدوات</button>
        
        <!-- حاوية قائمة الخيارات اليدوية والأدوات (مخفية افتراضياً لراحة رامات المتصفح) -->
        <div id="advancedMenu" style="display: none; margin-top: 10px; width: 100%;">
            <div class="sub-group" style="margin: 5px 0;">
                <button class="btn" onclick="saveAndRedirect('505goldhen/index.html')"> GoldHEN لنظام 5.05 </button>
                <button class="btn" onclick="saveAndRedirect('505/index.html')"> نظام 5.05 الإصدار v2.5 </button>
            </div>
            
            <div class="sub-group" style="margin: 5px 0;">
                <button class="btn" onclick="saveAndRedirect('672goldhen/index.html')"> GoldHEN لنظام 6.72 </button>
                <button class="btn" onclick="saveAndRedirect('672/index.html')"> نظام 6.72 الإصدار v3.0 </button>
            </div>
            
            <div class="sub-group" style="margin: 5px 0;">
                <button class="btn" onclick="saveAndRedirect('702/index.html')"> نظام 7.02 الإصدار v1.4 </button>
                <button class="btn" onclick="saveAndRedirect('75x/index.html')"> نظام 7.50 - 7.55 الإصدار</button>
            </div>
            
            <div class="sub-group" style="margin: 5px 0;">
                <button class="btn" onclick="saveAndRedirect('g2all/index.html')"> لنظام 7.00 - 13.00 </button>
                <button class="btn" onclick="saveAndRedirect('13.2,13.4,13.5,13.52/index.html')"> لنظام 13.02 - 13.52 </button>
            </div>
            
            <div class="sub-group" style="margin: 5px 0;">
                <button class="btn" onclick="saveAndRedirect('900goldhen/index.html')"> GoldHEN لنظام 9.00 </button>
                <button class="btn" onclick="saveAndRedirect('900v3/index.html')"> نظام 9.00 الإصدار | تلقائي </button>
            </div>
            
            <div class="sub-group" style="margin: 5px 0;">
                <button class="btn" onclick="saveAndRedirect('900v2/index.html')"> نظام 9.00 الإصدار | يدوي </button>
                <button class="btn" onclick="saveAndRedirect('restore/index.html')"> استعادة المضيف </button>
            </div>
        </div>
        <button id="resetFwBtn" class="reset-btn" style="display: none;" onclick="clearSavedFirmware()">🔄 تغيير النظام المحفوظ تلقائياً</button>
        <br>

        <button class="btn btn-onln" onclick="show_social()" style="margin-top: 30px; margin-bottom: 15px; width: 468px;">اضغط هنا للتواصل والدعم الفني للمحل</button>
    </div>

    <div id="social_media" style="display: none;">
        <h1 style="font-size: 18px; color: yellow;">الدعم الفني والتواصل:</h1>
        <a href="https://wa.me" target="_blank" style="color: #25D366; font-size: 20px; display: block; margin: 10px; text-decoration: none; font-weight: bold;">💬 تواصل معنا عبر واتساب: 01002342554</a>
        <a href="#" style="color: white; font-size: 20px; display: block; margin: 10px; text-decoration: none;">صفحة الفيس بوك للمتجر</a>
        <br>
        <button class="btn" onclick="load_menu()"> رجوع </button>
    </div>

    <script>
        var cacheStatus = document.getElementById('cacheStatus');
        var savedSystemKey = 'me4oo_saved_fw_path';
        var isCacheReady = false;
        var countdownTimer = null;

        // دالة الزرار الثاني: فتح وإغلاق القائمة اليدوية بسلاسة وحماية الرام
        function toggleAdvancedMenu() {
            var advMenu = document.getElementById("advancedMenu");
            if (advMenu.style.display === "none") {
                advMenu.style.display = "block";
            } else {
                advMenu.style.display = "none";
            }
        }

        function saveAndRedirect(path) {
            if(countdownTimer) clearInterval(countdownTimer);
            try { localStorage.setItem(savedSystemKey, path); } catch(e) {}
            location.replace(path);
        }

        function clearSavedFirmware() {
            if(countdownTimer) clearInterval(countdownTimer);
            try {
                localStorage.removeItem(savedSystemKey);
                document.getElementById('resetFwBtn').style.display = 'none';
                cacheStatus.innerHTML = '✅ تم حذف النظام المحفوظ، يمكنك اختيار السوفتوير من جديد.';
                cacheStatus.className = 'status-success';
                setTimeout(function() { location.reload(); }, 1000);
            } catch(e) {}
        }

        // 🌟 دالة الزرار الأول: الفحص الأوتوماتيكي الحقيقي الفعال من نواة المتصفح مباشرة
        function triggerAutoDetect() {
            var uaFull = navigator.userAgent;
            var match = uaFull.match(/PlayStation 4[ /]([\d.]+)/i);
            var isPS4 = match !== null;
            
            // قراءة دقيقة للإصدار الصافي العشري من بصمة المتصفح
            var fwVersion = isPS4 ? match[1] : "13.00"; 
            var fwNum = parseFloat(fwVersion);
            
            var topBar = document.getElementById("topBar");
            var timerContainer = document.getElementById("timerContainer");
            var targetPath = "";

            if (topBar) topBar.innerHTML = "⏳ جاري فحص نواة النظام... تم اكتشاف إصدار: PS4 " + fwVersion;

            // هندسة توجيه الأجهزة الذكية للمجلدات الفعلية المستقرة عندك
            if (fwNum >= 5.05 && fwNum <= 13.00) {
                targetPath = "g2all/index.html";
            } else if (fwNum >= 13.02 && fwNum <= 13.52) {
                targetPath = "13.2,13.4,13.5,13.52/index.html";
            } else {
                if (topBar) topBar.innerHTML = "❌ نظامك الحالي (" + fwVersion + ") غير مدعوم في الفحص التلقائي!";
                return;
            }

            // تشغيل التايمر التنازلي الحقيقي (3 ثوانٍ أمان تام لاستقرار الرام)
            var secondsLeft = 3;
            if (timerContainer) {
                timerContainer.innerHTML = '<div id="timerMsg" class="timer-badge">⏳ جاري تهيئة ذاكرة المتصفح.. الدخول التلقائي خلال (' + secondsLeft + ') ثوانٍ...</div>';
            }

            countdownTimer = setInterval(function() {
                secondsLeft--;
                var timerMsg = document.getElementById("timerMsg");
                if (secondsLeft <= 0) {
                    clearInterval(countdownTimer);
                    saveAndRedirect(targetPath); // تحويل طلقة بدون جليتش المساحة ممتلئة
                } else {
                    if(timerMsg) timerMsg.innerHTML = "⏳ جاري تهيئة ذاكرة المتصفح.. الدخول التلقائي خلال (" + secondsLeft + ") ثوانٍ...";
                }
            }, 1000);
        }

        function checkAutoRedirect() {
            try {
                var savedPath = localStorage.getItem(savedSystemKey);
                if (savedPath && isCacheReady) {
                    cacheStatus.innerHTML = '🚀 تم اكتشاف نظامك المحفوظ.. جاري الدخول التلقائي المستقر...';
                    cacheStatus.className = 'status-success';
                    document.getElementById('resetFwBtn').style.display = 'inline-block';
                    setTimeout(function() { location.replace(savedPath); }, 1000);
                } else if (savedPath) {
                    document.getElementById('resetFwBtn').style.display = 'inline-block';
                }
            } catch(e) {}
        }

        // ========== منظومة الكاش والـ AppCache الآمنة والمستقرة لمنع الكراش ==========
        var appCache = window.applicationCache;
        if (appCache) {
            appCache.addEventListener('checking', function() { cacheStatus.innerHTML = '⏳ جاري فحص ملفات الهوست بالتخزين المؤقت...'; }, false);
            appCache.addEventListener('downloading', function() { cacheStatus.innerHTML = '📥 أول زيارة: جاري تنزيل ملفات الكاش المؤقت لحماية متصفحك...'; }, false);
            appCache.addEventListener('progress', function(e) {
                if (e && e.total) {
                    var pct = Math.round((e.loaded / e.total) * 100);
                    cacheStatus.innerHTML = '📥 جاري حفظ ملفات الهوست أوفلاين ' + pct + '%... برجاء الانتظار لمنع تعليق المتصفح';
                }
            }, false);
            appCache.addEventListener('cached', function() { isCacheReady = true; cacheStatus.innerHTML = '✅ تم تثبيت كاش المحل بنجاح أوفلاين! اختر النظام الآن لبدء تشغيل آمن.'; cacheStatus.className = 'status-success'; checkAutoRedirect(); }, false);
            appCache.addEventListener('noupdate', function() { isCacheReady = true; cacheStatus.innerHTML = '✅ ملفات الهوست جاهزة ومستقرة أوفلاين داخل المتصفح.'; cacheStatus.className = 'status-success'; checkAutoRedirect(); }, false);
            appCache.addEventListener('updateready', function() { try { appCache.swapCache(); } catch (e) {} cacheStatus.innerHTML = '🔄 تم تحديث السورس، جاري تحديث الصفحة فوراً...'; setTimeout(function() { location.reload(); }, 500); }, false);
            appCache.addEventListener('error', function() { isCacheReady = true; cacheStatus.innerHTML = '⚠️ تشغيل مباشر عبر الشبكة (الخادم أوفلاين حالياً).'; checkAutoRedirect(); }, false);
        } else {
            isCacheReady = true; cacheStatus.innerHTML = '⚙️ المتصفح جاهز ومستقر للتشغيل المباشر.'; checkAutoRedirect();
        }

        function show_social(){ document.getElementById("social_media").style.display = "block"; document.getElementById("menu").style.display = "none"; }
        function load_menu(){ document.getElementById("menu").style.display = "block"; document.getElementById("social_media").style.display = "none"; }
    </script>
</body>
</html>
