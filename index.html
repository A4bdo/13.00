<!DOCTYPE html>
<html lang="ar" manifest="cache.appcache">
<head>
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ME4OO PS STORE لخدمات وصيانة البلايستيشن وتنزيل الألعاب</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .reset-btn {
            background-color: #ff3333;
            color: white;
            border: none;
            padding: 8px 15px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 10px;
            font-weight: bold;
        }
        .reset-btn:hover { background-color: #cc0000; }
        .status-loading { color: #ffcc00; font-weight: bold; }
        .status-success { color: #25D366; font-weight: bold; }
        .auto-btn {
            background-color: #00b4d8;
            color: white;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <script>
        var histlength = history.length;
        history.go(-histlength); 
    </script>
    
    <h1 id="msgs">ME4OO PS STORE لخدمات وصيانة البلايستيشن وتنزيل الألعاب</h1>
    <h2 id="msgs2">امانه عليك تصلي على حبيبك النبي</h2>
    <div id="cacheStatus" class="status-loading" style="font-size: 16px; margin-top: 5px;">⏳ جاري التحقق من ملفات النظام...</div>
    <br>
    
    <div id="menu">
        <h1 style="font-size: 18px; color: yellow;">حالة الفحص التلقائي للنظام</h1>
        
        <!-- حاوية الأزرار الديناميكية الذكية لحماية رام المتصفح -->
        <div id="dynamicZone" style="margin-bottom: 20px;">
            <p style="color: #8b95a3;">جاري قراءة سوفتوير المنصة بالخلفية...</p>
        </div>

        <!-- زر إعادة ضبط واختيار نظام أخر لو أراد الخروج من التثبيت التلقائي -->
        <button id="resetFwBtn" class="reset-btn" style="display: none;" onclick="clearSavedFirmware()">🔄 إلغاء الحفظ التلقائي للنظام</button>
        <br>

        <button class="btn btn-onln" onmouseover="msgs.innerHTML='صل على حبيبك النبي.'" onmouseout="msgs.innerHTML='ME4OO PS STORE لخدمات وصيانة البلايستيشن وتنزيل الألعاب'" onclick="show_social()" style="margin-top: 50px; margin-bottom: 15px; width: 468px;">اضغط هنا للتواصل والدعم الفني للمحل</button>
    </div>

    <div id="social_media" style="display: none;">
        <h1 style="font-size: 18px; color: yellow;">الدعم الفني والتواصل:</h1>
        <a href="https://wa.me" target="_blank" style="color: #25D366; font-size: 20px; display: block; margin: 10px; text-decoration: none; font-weight: bold;">💬 تواصل معنا عبر واتساب: 01002342554</a>
        <a href="#" style="color: white; font-size: 20px; display: block; margin: 10px; text-decoration: none;">صفحة الفيس بوك للمتجر</a>
        <br>
        <button class="btn" onclick="load_menu()"> رجوع </button>
    </div>

    <script>
        var cacheStatus = document.getElementById('cacheStatus');
        var savedSystemKey = 'me4oo_saved_fw_path';
        var isCacheReady = false;
        var countdownTimer = null;

        // دالة حفظ الاختيار والانتقال المباشر للأنظمة
        function saveAndRedirect(path) {
            if(countdownTimer) clearInterval(countdownTimer);
            try { localStorage.setItem(savedSystemKey, path); } catch(e) {}
            location.replace(path);
        }

        // دالة حذف المسار المحفوظ لإتاحة الاختيار من جديد
        function clearSavedFirmware() {
            if(countdownTimer) clearInterval(countdownTimer);
            try {
                localStorage.removeItem(savedSystemKey);
                document.getElementById('resetFwBtn').style.display = 'none';
                cacheStatus.innerHTML = '✅ تم حذف النظام المحفوظ، يمكنك إعادة تحميل الصفحة لإعادة الفحص.';
                cacheStatus.className = 'status-success';
                setTimeout(function() { location.reload(); }, 1500);
            } catch(e) {}
        }

        // منظومة الفحص التلقائي والتوزيع الثنائي لحماية الرام مع العداد التنازلي التلقائي
        function runMasterAutoDetect() {
            var uaFull = navigator.userAgent;
            var match = uaFull.match(/PlayStation 4[ /]([\d.]+)/i);
            var isPS4 = match !== null;
            var fwVersion = isPS4 ? match[1] : "Unknown";
            var fwNum = parseFloat(fwVersion);
            
            var dynamicZone = document.getElementById("dynamicZone");
            var targetPath = "";
            var btnText = "";

            if (!isPS4) {
                dynamicZone.innerHTML = "<p class='status-loading'>⚠️ معاينة الكمبيوتر نشطة: يرجى فتح الصفحة من متصفح PS4 الفعلي.</p>";
                // محاكاة وضع التجربة الافتراضي لجهاز الـ 13.00 الخاص بك للتحقق من عمل التايمر بالكمبيوتر
                fwNum = 13.00; 
                isPS4 = true;
            }

            if (isPS4) {
                // الفئة الأولى: الأنظمة المستقرة القديمة والمتوسطة
                if (fwNum >= 5.05 && fwNum <= 13.00) {
                    targetPath = "g2all/index.html";
                    btnText = "▶️ تفعيل التعديلة المستقرة (FW " + fwVersion + ")";
                } 
                // الفئة الثانية: الأنظمة الحديثة المحدثة بجولد هين جديد
                else if (fwNum >= 13.02 && fwNum <= 13.52) {
                    targetPath = "13.2,13.4,13.5,13.52/index.html";
                    btnText = "🔥 تفعيل التعديلة الحديثة المحدثة (FW " + fwVersion + ")";
                } 
                else {
                    dynamicZone.innerHTML = "<p style='color: #ff3333; font-weight: bold;'>❌ عذراً، سوفتوير جهازك الحالي (" + fwVersion + ") غير مدعوم في هذا البناء.</p>";
                    return;
                }

                // إنشاء وحقن الزر المخصص بشكل VIP تلقائياً للرام
                dynamicZone.innerHTML = '<button class="btn auto-btn" onclick="saveAndRedirect(\'' + targetPath + '\')">' + btnText + '</button>' +
                                         '<p id="timerMsg" style="color: #ffcc00; font-weight: bold; margin-top: 15px; font-size: 15px;"></p>';
                
                // تشغيل عداد الثواني التنازلي الحامي للمعالج (3 ثوانٍ أمان للرام)
                var secondsLeft = 3;
                var timerMsg = document.getElementById("timerMsg");
                timerMsg.innerHTML = "⏳ جاري تهيئة ذاكرة المتصفح.. سيتم بدء التشغيل التلقائي خلال (" + secondsLeft + ") ثوانٍ...";

                countdownTimer = setInterval(function() {
                    secondsLeft--;
                    if (secondsLeft <= 0) {
                        clearInterval(countdownTimer);
                        saveAndRedirect(targetPath); // التوجيه الأوتوماتيكي عند انتهاء التايمر
                    } else {
                        timerMsg.innerHTML = "⏳ جاري تهيئة ذاكرة المتصفح.. سيتم بدء التشغيل التلقائي خلال (" + secondsLeft + ") ثوانٍ...";
                    }
                }, 1000);
            }
        }

        // فحص وجود تفعيل وتوجيه تلقائي مستقر داخل ذاكرة كاش المتصفح
        function checkAutoRedirect() {
            try {
                var savedPath = localStorage.getItem(savedSystemKey);
                if (savedPath && isCacheReady) {
                    cacheStatus.innerHTML = '🚀 تم اكتشاف نظامك المحفوظ.. جاري الدخول التلقائي المستقر...';
                    cacheStatus.className = 'status-success';
                    document.getElementById('resetFwBtn').style.display = 'inline-block';
                    setTimeout(function() { location.replace(savedPath); }, 1000);
                } else if (savedPath) {
                    document.getElementById('resetFwBtn').style.display = 'inline-block';
                    runMasterAutoDetect();
                } else {
                    runMasterAutoDetect();
                }
            } catch(e) {}
        }

        // ========== منظومة الكاش والـ AppCache الآمنة والمستقرة لمنع الكراش ==========
        var appCache = window.applicationCache;
        if (appCache) {
            appCache.addEventListener('checking', function() { cacheStatus.innerHTML = '⏳ جاري فحص ملفات الهوست بالتخزين المؤقت...'; }, false);
            appCache.addEventListener('downloading', function() { cacheStatus.innerHTML = '📥 أول زيارة: جاري تنزيل ملفات الكاش المؤقت لحماية متصفحك...'; }, false);
            appCache.addEventListener('progress', function(e) {
                if (e && e.total) {
                    var pct = Math.round((e.loaded / e.total) * 100);
                    cacheStatus.innerHTML = '📥 جاري حفظ ملفات الهوست أوفلاين ' + pct + '%... برجاء الانتظار لمنع تعليق المتصفح';
                }
            }, false);
            appCache.addEventListener('cached', function() {
                isCacheReady = true;
                cacheStatus.innerHTML = '✅ تم تثبيت كاش المحل بنجاح أوفلاين! جاري بدء الفحص الذكي للأنظمة.';
                cacheStatus.className = 'status-success';
                checkAutoRedirect();
            }, false);
            appCache.addEventListener('noupdate', function() {
                isCacheReady = true;
                cacheStatus.innerHTML = '✅ ملفات الهوست جاهزة ومستقرة أوفلاين داخل المتصفح.';
                cacheStatus.className = 'status-success';
                checkAutoRedirect();
            }, false);
            appCache.addEventListener('updateready', function() {
                try { appCache.swapCache(); } catch (e) {}
                cacheStatus.innerHTML = '🔄 تم تحديث السورس، جاري تحديث الصفحة فوراً...';
                setTimeout(function() { location.reload(); }, 500);
            }, false);
            appCache.addEventListener('error', function() {
                isCacheReady = true; 
                cacheStatus.innerHTML = '⚠️ تشغيل مباشر عبر الشبكة (الخادم أوفلاين حالياً).';
                checkAutoRedirect();
            }, false);
        } else {
            isCacheReady = true;
            cacheStatus.innerHTML = '⚙️ المتصفح جاهز ومستقر للتشغيل المباشر.';
            checkAutoRedirect();
        }

        function show_social(){
            document.getElementById("social_media").style.display = "block";
            document.getElementById("menu").style.display = "none";
        }
        function load_menu(){
            document.getElementById("menu").style.display = "block";
            document.getElementById("social_media").style.display = "none";
        }
    </script>
</body>
</html>
