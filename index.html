<!DOCTYPE html>
<html lang="ar" manifest="cache.appcache">
<head>
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ME4OO PS STORE لخدمات وصيانة البلايستيشن وتنزيل الألعاب</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* 👁️ تنسيقات هادئة ومريحة للعين باللون الأبيض الناصع */
        .reset-btn {
            background-color: #d90429;
            color: white;
            border: none;
            padding: 8px 15px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 10px;
            font-weight: bold;
        }
        .reset-btn:hover { background-color: #b3001b; }
        
        /* ⚪ تكبير وإبراز جمل حالة التحقق والكاش باللون الأبيض الناصع والصريح جداً للمحل */
        .status-loading { color: #ffb703; font-weight: bold; font-size: 20px !important; }
        .status-success { color: #ffffff !important; font-weight: bold !important; font-size: 24px !important; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }

        /* 🌟 	شريط الفحص العلوي بلون داكن ومريح وبدون توهج فاقع */
        .top-bar {
            background: #141923;
            border-bottom: 2px solid #e0a96d;
            padding: 12px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #f4f6f9;
            margin: -16px -16px 20px -16px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.6);
        }

        /* 🎯 محاذاة وتوسيط كامل للأزرار بالملي في منتصف الشاشة */
        #menu, #social_media, .sub-group {
            text-align: center !important;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .btn {
            display: inline-block;
            margin: 7px auto !important;
            min-width: 290px;
        }

        /* 💛 تصميم الزر الأصفر التلقائي بألوان مطفية ناعمة لراحة العين */
        .multi-btn {
            background: linear-gradient(135deg, #e0a96d 0%, #cca43b 100%) !important;
            color: #1a1a1a !important;
            font-weight: bold !important;
            border: 2px solid #e0a96d !important;
            box-shadow: 0 4px 12px rgba(204, 164, 59, 0.3) !important;
            transition: all 0.3s ease;
        }
        .multi-btn:hover {
            background: linear-gradient(135deg, #cca43b 0%, #e0a96d 100%) !important;
            box-shadow: 0 4px 18px rgba(204, 164, 59, 0.5) !important;
            transform: scale(1.02);
        }

        /* ⚙️ زر الخيارات المتقدمة بلون أزرق بترولي هادئ جداً */
        .advanced-toggle-btn {
            background: linear-gradient(135deg, #2b5c8f 0%, #1c3d63 100%) !important;
            color: #ffffff !important;
            font-weight: bold !important;
            border: 2px solid #3b7bb5 !important;
            box-shadow: 0 4px 12px rgba(43, 92, 143, 0.3) !important;
        }
        .advanced-toggle-btn:hover {
            background: linear-gradient(135deg, #3b7bb5 0%, #2b5c8f 100%) !important;
            box-shadow: 0 4px 18px rgba(43, 92, 143, 0.5) !important;
        }

        /* 🔔 صندوق العداد التنازلي التلقائي المطور (خلفية داكنة لإبراز خط العداد 100%) */
        .timer-badge {
            background: rgba(10, 15, 25, 0.95) !important;
            border: 2px solid #cca43b !important;
            color: #ffffff !important;
            padding: 14px 28px !important;
            border-radius: 10px !important;
            display: inline-block !important;
            font-size: 17px !important;
            font-weight: bold !important;
            margin-top: 15px !important;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.8) !important;
            letter-spacing: 0.5px;
        }
        
        .seconds-count {
            color: #ffb703 !important;
            font-size: 22px !important;
            padding: 0 5px;
            text-shadow: 0 0 5px rgba(255, 183, 3, 0.5);
        }
    </style>
</head>
<body>
    <div id="topBar" class="top-bar">ME4OO PS STORE - (Auto Exploit Selection)</div>

    <h1 id="msgs">ME4OO PS STORE لخدمات وصيانة البلايستيشن وتنزيل الألعاب</h1>
    <!-- ⚪ تكبير جملة الصلاة على النبي كلياً وتلوينها باللون الأبيض الصريح لراحة العين والوضوح التام -->
    <h2 id="msgs2" style="text-align: center; font-size: 32px !important; color: #ffffff !important; font-weight: bold; text-shadow: 0 2px 4px rgba(0,0,0,0.8); margin: 15px 0;">امانه عليك تصلي على حبيبك النبي</h2>
    <div id="cacheStatus" class="status-loading" style="margin-top: 5px; text-align: center;">⏳ جاري التحقق من ملفات النظام...</div>
    <br>
    
    <div id="menu">
        <button class="btn multi-btn" onmouseover="document.getElementById('topBar').innerHTML='PS4 GoldHEN Host - (Auto Exploit Selection)'" onclick="triggerAutoDetect()"> GoldHEN Multi FW </button>
        
        <div id="timerContainer" style="margin-top: 5px; min-height: 55px;"></div>
        <br>

        <button class="btn advanced-toggle-btn" onclick="toggleAdvancedMenu()">⚙️ خيارات الأنظمة اليدوية والأدوات</button>
        
        <div id="advancedMenu" style="display: none; margin-top: 10px; width: 100%;">
            <div class="sub-group" style="margin: 5px 0;">
                <button class="btn" onclick="saveAndRedirect('505goldhen/index.html')"> GoldHEN لنظام 5.05 </button>
                <button class="btn" onclick="saveAndRedirect('505/index.html')"> نظام 5.05 الإصدار v2.5 </button>
            </div>
            
            <div class="sub-group" style="margin: 5px 0;">
                <button class="btn" onclick="saveAndRedirect('672goldhen/index.html')"> GoldHEN لنظام 6.72 </button>
                <button class="btn" onclick="saveAndRedirect('672/index.html')"> نظام 6.72 الإصدار v3.0 </button>
            </div>
            
            <div class="sub-group" style="margin: 5px 0;">
                <button class="btn" onclick="saveAndRedirect('702/index.html')"> نظام 7.02 الإصدار v1.4 </button>
                <button class="btn" onclick="saveAndRedirect('75x/index.html')"> نظام 7.50 - 7.55 الإصدار</button>
            </div>
            
            <div class="sub-group" style="margin: 5px 0;">
                <button class="btn" onclick="saveAndRedirect('g2all/index.html')"> لنظام 7.00 - 13.00 </button>
                <button class="btn" onclick="saveAndRedirect('13.2,13.4,13.5,13.52/index.html')"> لنظام 13.02 - 13.52 </button>
            </div>
            
            <div class="sub-group" style="margin: 5px 0;">
                <button class="btn" onclick="saveAndRedirect('900goldhen/index.html')"> GoldHEN لنظام 9.00 </button>
                <button class="btn" onclick="saveAndRedirect('900v3/index.html')"> نظام 9.00 الإصدار | تلقائي </button>
            </div>
            
            <div class="sub-group" style="margin: 5px 0;">
                <button class="btn" onclick="saveAndRedirect('900v2/index.html')"> نظام 9.00 الإصدار | يدوي </button>
                <button class="btn" onclick="saveAndRedirect('restore/index.html')"> استعادة المضيف </button>
            </div>
        </div>
        <button id="resetFwBtn" class="reset-btn" style="display: none;" onclick="clearSavedFirmware()">🔄 تغيير النظام المحفوظ تلقائياً</button>
        <br>

        <button class="btn btn-onln" onclick="show_social()" style="margin-top: 30px; margin-bottom: 15px; width: 468px;">اضغط هنا للتواصل والدعم الفني للمحل</button>
    </div>

    <div id="social_media" style="display: none;">
        <h1 style="font-size: 18px; color: yellow;">الدعم الفني والتواصل:</h1>
        <a href="https://wa.me" target="_blank" style="color: #25D366; font-size: 20px; display: block; margin: 10px; text-decoration: none; font-weight: bold;">💬 تواصل معنا عبر واتساب: 01002342554</a>
        <a href="#" style="color: white; font-size: 20px; display: block; margin: 10px; text-decoration: none;">صفحة الفيس بوك للمتجر</a>
        <br>
        <button class="btn" onclick="load_menu()"> رجوع </button>
    </div>

    <script>
        var cacheStatus = document.getElementById('cacheStatus');
        var savedSystemKey = 'me4oo_saved_fw_path';
        var isCacheReady = false;
        var countdownTimer = null;

        function toggleAdvancedMenu() {
            var advMenu = document.getElementById("advancedMenu");
            if (advMenu.style.display === "none") {
                advMenu.style.display = "block";
            } else {
                advMenu.style.display = "none";
            }
        }

        function saveAndRedirect(path) {
            if(countdownTimer) clearInterval(countdownTimer);
            try { localStorage.setItem(savedSystemKey, path); } catch(e) {}
            location.replace(path);
        }

        function clearSavedFirmware() {
            if(countdownTimer) clearInterval(countdownTimer);
            try {
                localStorage.removeItem(savedSystemKey);
                document.getElementById('resetFwBtn').style.display = 'none';
                cacheStatus.innerHTML = '✅ تم حذف النظام المحفوظ، يمكنك اختيار السوفتوير من جديد.';
                cacheStatus.className = 'status-success';
                setTimeout(function() { location.reload(); }, 1000);
            } catch(e) {}
        }

        function triggerAutoDetect() {
            var uaFull = navigator.userAgent;
            var match = uaFull.match(/PlayStation 4[ /]([\d.]+)/i);
            var isPS4 = match !== null;
            
            var fwVersion = isPS4 ? match[1] : "13.00"; 
            var fwNum = parseFloat(fwVersion);
            
            var topBar = document.getElementById("topBar");
            var timerContainer = document.getElementById("timerContainer");
            var targetPath = "";

            if (topBar) topBar.innerHTML = "⏳ جاري فحص نواة النظام... تم اكتشاف إصدار: PS4 " + fwVersion;

            if (fwNum >= 5.05 && fwNum <= 13.00) {
                targetPath = "g2all/index.html";
            } else if (fwNum >= 13.02 && fwNum <= 13.52) {
                targetPath = "13.2,13.4,13.5,13.52/index.html";
            } else {
                if (topBar) topBar.innerHTML = "❌ نظامك الحالي (" + fwVersion + ") غير مدعوم في الفحص التلقائي!";
                return;
            }

            var secondsLeft = 3;
            if (timerContainer) {
                timerContainer.innerHTML = '<div id="timerMsg" class="timer-badge">⏳ جاري تهيئة الذاكرة.. الدخول التلقائي خلال (<span id="secondsCount" class="seconds-count">' + secondsLeft + '</span>) ثوانٍ...</div>';
            }

            countdownTimer = setInterval(function() {
                secondsLeft--;
                var secondsCount = document.getElementById("secondsCount");
                if (secondsLeft <= 0) {
                    clearInterval(countdownTimer);
                    saveAndRedirect(targetPath);
                } else {
                    if(secondsCount) secondsCount.innerHTML = secondsLeft;
                }
            }, 1000);
        }

        function checkAutoRedirect() {
            try {
                var savedPath = localStorage.getItem(savedSystemKey);
                if (savedPath && isCacheReady) {
                    cacheStatus.innerHTML = '🚀 تم اكتشاف نظامك المحفوظ.. جاري الدخول التلقائي المستقر...';
                    cacheStatus.className = 'status-success';
                    document.getElementById('resetFwBtn').style.display = 'inline-block';
                    setTimeout(function() { location.replace(savedPath); }, 1000);
                } else if (savedPath) {
                    document.getElementById('resetFwBtn').style.display = 'inline-block';
                }
            } catch(e) {}
        }

        // ========== منظومة الكاش والـ AppCache الآمنة والمعدلة باللون الأبيض العريض ==========
        var appCache = window.applicationCache;
        if (appCache) {
            appCache.addEventListener('checking', function() { cacheStatus.innerHTML = '⏳ جاري فحص ملفات الهوست بالتخزين المؤقت...'; cacheStatus.className = 'status-loading'; }, false);
            appCache.addEventListener('downloading', function() { cacheStatus.innerHTML = '📥 أول زيارة: جاري تنزيل ملفات الكاش المؤقت لحماية متصفحك...'; cacheStatus.className = 'status-loading'; }, false);
            appCache.addEventListener('progress', function(e) {
                if (e && e.total) {
                    var pct = Math.round((e.loaded / e.total) * 100);
                    cacheStatus.innerHTML = '📥 جاري حفظ ملفات الهوست أوفلاين ' + pct + '%... برجاء الانتظار لمنع تعليق المتصفح';
                    cacheStatus.className = 'status-loading';
                }
            }, false);
            appCache.addEventListener('cached', function() { isCacheReady = true; cacheStatus.innerHTML = '⚙️ المتصفح جاهز ومستقر للتشغيل المباشر.'; cacheStatus.className = 'status-success'; checkAutoRedirect(); }, false);
            appCache.addEventListener('noupdate', function() { isCacheReady = true; cacheStatus.innerHTML = '⚙️ المتصفح جاهز ومستقر للتشغيل المباشر.'; cacheStatus.className = 'status-success'; checkAutoRedirect(); }, false);
            appCache.addEventListener('updateready', function() { try { appCache.swapCache(); } catch (e) {} cacheStatus.innerHTML = '🔄 تم تحديث السورس، جاري تحديث الصفحة فوراً...'; cacheStatus.className = 'status-loading'; setTimeout(function() { location.reload(); }, 500); }, false);
            appCache.addEventListener('error', function() { isCacheReady = true; cacheStatus.innerHTML = '⚙️ المتصفح جاهز ومستقر للتشغيل المباشر.'; cacheStatus.className = 'status-success'; checkAutoRedirect(); }, false);
        } else {
            isCacheReady = true; cacheStatus.innerHTML = '⚙️ المتصفح جاهز ومستقر للتشغيل المباشر.'; cacheStatus.className = 'status-success'; checkAutoRedirect();
        }

        function show_social(){ document.getElementById("social_media").style.display = "block"; document.getElementById("menu").style.display = "none"; }
        function load_menu(){ document.getElementById("menu").style.display = "block"; document.getElementById("social_media").style.display = "none"; }
    </script>
</body>
</html>
