<!DOCTYPE html>
<html lang="ar" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ME4OO PS STORE - تفعيل الجيلبريك</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        color: #c8ced8;
        font:
          15px/1.45 "Segoe UI",
          system-ui,
          sans-serif;
        background-image: url('img.jpg');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
      }
      #brand {
        text-align: center;
        padding: 12px 10px;
        background: rgba(14, 17, 22, 0.85);
        border-bottom: 1px solid #1e2732;
      }
      #brand img {
        width: 32px;
        height: 32px;
        margin-right: 8px;
        border-radius: 50%;
        vertical-align: middle;
      }
      #brand b {
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.12em;
        color: #e6ebf2;
        vertical-align: middle;
      }

      /* منظومة حركة الانتظار الدائرية تحت الشعار */
      #spin {
        position: fixed;
        top: calc(50% + 20px);
        left: 50%;
        width: 46px;
        height: 46px;
        margin: -23px 0 0 -23px;
        border: 4px solid #1e2732;
        border-top-color: #25D366; /* تغيير اللون للون الأخضر المميز للمحل */
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #msg {
        position: fixed;
        top: 50%;
        left: 0;
        right: 0;
        transform: translateY(-50%);
        text-align: center;
        font-size: 18px;
        letter-spacing: 0.5px;
        display: none;
        font-weight: bold;
      }
      #wrap {
        padding: 0;
      }
      #state,
      #out {
        display: none;
      }

      body.done #spin {
        display: none;
      }
      body.fail #spin {
        display: none;
      }
      body.fail #msg {
        display: block;
      }

      /* التحكم في وضع السجل الكامل للاختراق (Step Log) */
      body.log #spin,
      body.log #msg {
        display: none;
      }
      body.log #wrap {
        padding: 14px 18px;
      }
      body.log #state {
        display: block;
        font-size: 22px;
        font-weight: 700;
        margin: 0 0 8px;
      }
      body.log #out {
        display: block;
        white-space: pre-wrap;
        font:
          12px/1.45 Consolas,
          monospace;
        background: rgba(17, 21, 27, 0.9);
        border: 1px solid #1e2732;
        border-radius: 5px;
        padding: 10px 12px;
        height: calc(100vh - 141px);
        overflow-y: auto;
    }
      .ok {
        color: #25D366;
      }
      .bad {
        color: #ff3333;
      }
      .warn {
        color: #ffcc00;
      }
      .safe {
        color: #25D366;
      }
      .danger {
        color: #ff3333;
      }
      code {
        color: #9fb3d0;
      }
      .shop-contact {
        position: fixed;
        bottom: 20px;
        left: 0;
        right: 0;
        text-align: center;
        color: #25D366;
        font-size: 16px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <!-- تغيير الشعار والاسم لـ ME4OO PS STORE لضمان الخصوصية والاحترافية -->
    <div id="brand">
      <img
        src="logo.png"
        alt="ME4OO PS STORE"
        width="32"
        height="32"
      /><b>ME4OO PS STORE</b>
    </div>
    
    <div id="spin"></div>
    <div id="msg"></div>
    <div id="wrap">
      <div id="state">🚀 جاري تحميل ثغرة النظام... يرجى الانتظار دون لمس أي أزرار</div>
      <div id="out"></div>
    </div>
    
    <!-- بصمة متجرك تظل واضحة طوال عملية الحقن -->
    <div class="shop-contact">💬 صيانة البلايستيشن وتنزيل الألعاب: 01002342554</div>

    <!-- استدعاء ملفات الأكواد والـ Offsets الأصلية للثغرة بشكل متتالي ومؤمن محلياً -->
    <script src="ps4_offsets.js"></script>
    <script src="int64.js"></script>
    <script src="mem.js"></script>
    <script src="core.js"></script>
    <script src="jb.js"></script>
    <script>
      // تشغيل دالة الجيلبريك المستقرة المدمجة تلقائياً وتمرير الجولد هين المحدث المرفق
      document.addEventListener("DOMContentLoaded", function() {
          setTimeout(function() {
              try {
                  if (typeof create_payload === "function") {
                      // استدعاء دالة الحقن الأساسية المخزنة داخل ملف jb.js الأصلي لتفعيل التهكير
                      create_payload("goldhen.bin");
                  } else {
                      document.getElementById("state").innerHTML = "⚠️ جاري تنشيط كسر النواة.. يرجى الانتظار ثوانٍ...";
                  }
              } catch (e) {
                  console.log("Exploit execution...");
              }
          }, 1000); // مهلة أمان قصيرة لتثبيت استقرار ذاكرة المتصفح ومنع الكراش المفاجئ
      });
    </script>
  </body>
</html>
