<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفعيل GoldHEN - ME4OO PS STORE</title>
    <style>
        /* تنسيقات هادئة وفخمة مخصصة لشاشة الشحن بالسنتر تماماً */
        body {
            background-color: #0b132b;
            color: #ffffff;
            font-family: sans-serif;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .main-box {
            background: rgba(20, 25, 35, 0.95);
            border: 2px solid #e0a96d;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.8);
            min-width: 340px;
        }
        .loader-ring {
            border: 5px solid rgba(224, 169, 109, 0.1);
            border-radius: 50%;
            border-top: 5px solid #e0a96d;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 25px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .status-txt {
            font-size: 22px;
            font-weight: bold;
            color: #ffffff !important;
            margin-top: 15px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>
    <div class="main-box">
        <!-- تثبيت شعار اسم محلك الفخم كلياً بالسنتر وبخط أبيض كبير -->
        <h1 style="color: #e0a96d; font-size: 28px; margin-bottom: 5px; font-weight: bold;">ME4OO PS STORE</h1>
        <!-- جملة الصلاة على النبي بالخط العريض واللون الأبيض الناصع والصريح -->
        <h2 style="color: #ffffff !important; font-size: 24px; margin-bottom: 20px; font-weight: bold;">امانه عليك تصلي على حبيبك النبي</h2>
        
        <div class="loader-ring"></div>
        <!-- حاوية النص التفاعلي الفوسفوري لعرض حالة الحقن الفعلي للمتصفح -->
        <div id="state" class="status-txt">⏳ جاري قراءة وتفعيل ثغرة النواة أوفلاين...</div>
    </div>

    <!-- ربط كافة ملفات فريق RAW GAME المنفصلة بالترتيب الصحيح لسرعة الاستقرار في الرام -->
    <script src="ps4_offsets.js"></script>
    <script src="int64.js"></script>
    <script src="mem.js"></script>
    <script src="core.js"></script>
    <script src="jb.js"></script>
    <script>
        // دالة البدء الذكية والمؤمنة لتشغيل الجيلبريك أوفلاين في المحل
        window.onload = function() {
            setTimeout(function() {
                if (typeof create_payload === "function") {
                    // تشغيل وحقن ملف الجولد هين المخزن محلياً على سيرفرك المباشر
                    create_payload("goldhen.bin");
                } else {
                    document.getElementById("state").innerHTML = "❌ خطأ برمي: ملف تشغيل الثغرة jb.js غير معرّف أو ناقص أوفلاين!";
                }
            }, 500); // مهلة نصف ثانية لضمان استقرار وجاهزية ذاكرة المتصفح
        };
    </script>
</body>
</html>
