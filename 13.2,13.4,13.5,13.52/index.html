<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        /* 👁️ تنسيق السنتر الكامل لراحة العين باللون الأبيض الناصع والصريح */
        body {
            background-color: #0b132b;
            color: #ffffff;
            font-family: sans-serif;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .main-container {
            background: rgba(20, 25, 35, 0.95);
            border: 2px solid #e0a96d;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.8);
            min-width: 340px;
        }
        .loader-bar {
            border: 5px solid rgba(224, 169, 109, 0.1);
            border-radius: 50%;
            border-top: 5px solid #ffffff;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 25px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .status-txt {
            font-size: 22px;
            font-weight: bold;
            color: #ffffff !important;
            margin-top: 15px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        .support-link {
            color: #ffffff !important;
            font-size: 18px;
            text-decoration: none;
            font-weight: bold;
            display: block;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- براند المحل الفخم بالسنتر وبخط أبيض عريض -->
        <h1 style="color: #e0a96d; font-size: 28px; margin-bottom: 5px; font-weight: bold;">ME4OO PS STORE</h1>

    <script src="ps4_offsets.js"></script>
    <script src="int64.js"></script>
    <script src="mem.js"></script>
    <script src="core.js"></script>
    <script src="jb.js"></script>
    
    <script>
        // دالة تفعيل الأوفلاين الفوري عند تحميل واجهة السوفت الجديد
        window.onload = function() {
            setTimeout(function() {
                if (typeof create_payload === "function") {
                    // سحب ملف البيلود الذهبي محلياً من كاش الجهاز طلقة
                    create_payload("goldhen.bin");
                } else {
                    var stateDiv = document.getElementById("state");
                    if(stateDiv) stateDiv.innerHTML = "❌ خطأ برمي: ملف الثغرة jb.js غير معرّف أو ناقص أوفلاين!";
                }
            }, 400); // مهلة أمان قصيرة جداً لتهيئة الـ Webkit ومنع رسائل المساحة
        };
    </script>
</body>
