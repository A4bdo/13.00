<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ME4OO PS STORE - 13.52 FW Stable</title>
    <style>
        /* 👁️ تصميم VIP عايم بالكامل فوق الخلفية وبدون أي مربعات ممسوحة */
        body {
            background-image: url("img.jpg") !important;
            background-size: cover !important;
            background-position: center !important;
            background-repeat: no-repeat !important;
            background-attachment: fixed !important;
            color: #ffffff;
            font-family: sans-serif;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        
        /* 🔄 تصميم حلقة الـ Loading الدائرية المتحركة الأنيقة مثل الأنظمة المستقرة */
        .loader-ring {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top: 4px solid #ffffff; /* حلقة بيضاء ناصعة تدور بنعومة */
            width: 55px;
            height: 55px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(3600deg); }
        }

        .status-txt {
            font-size: 24px;
            font-weight: bold;
            color: #ffffff !important;
            margin-top: 15px;
            text-shadow: 0 2px 6px rgba(0,0,0,0.9);
        }
        .support-link {
            color: #ffffff !important;
            font-size: 19px;
            text-decoration: none;
            font-weight: bold;
            display: block;
            margin-top: 25px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.9);
        }
    </style>
</head>

    <script src="int64.js"></script>

            setTimeout(function() {
                if (typeof create_payload === "function") {
                    // سحب ملف البيلود الذهبي محلياً من كاش الجهاز طلقة واختفاء علامة الكراش

                } else {
                    var stateDiv = document.getElementById("state");
                    if(stateDiv) stateDiv.innerHTML = "❌ خطأ برمي: ملف الثغرة jb.js غير معرّف أو ناقص أوفلاين!";
                }
            }, 400); // مهلة أمان قصيرة جداً لتهيئة الـ Webkit ومنع رسائل المساحة ممتلئة
        };
    </script>
</body>
