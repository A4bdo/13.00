<!DOCTYPE html>
<html lang="ar" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ME4OO PS STORE لخدمات وصيانة البلايستيشن وتنزيل الألعاب</title>
<style>
  html, body { 
    margin: 0; 
    padding: 0; 
    color: #c8ced8; 
    font: 15px/1.45 "Segoe UI", system-ui, sans-serif;
    background-image: url('img.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    min-height: 100vh;
  }
  #wrap { padding:16px 18px; text-align: center; }
  #state { font-size:24px; font-weight:700; margin:15px 0 6px; }
  #det { font-size:15px; color:#8b95a3; margin:0 0 8px; }
  #det b { color:#ffcc00; font-weight:600; }
  #cache { font-size:14px; color:#a2a8b3; margin:0 0 10px; min-height:14px; font-weight: bold; }
  #cache.cacheok { color:#25D366; }
  .ok { color:#25D366; } .bad { color:#ff3333; } .warn { color:#ffcc00; }
  #brand { text-align:center; padding:12px 10px; background:rgba(14, 17, 22, 0.85);
           border-bottom:1px solid #1e2732; }
  #brand img { width:32px; height:32px; margin-right:8px; border-radius:50%;
               vertical-align:middle; }
  #brand b { font-size:18px; font-weight:700; letter-spacing:.12em;
             color:#e6ebf2; vertical-align:middle; }
</style>
</head>
<body>
<!-- الواجهة المحدثة بالكامل باسم المحل الجديد -->
<div id="brand"><img src="logo.png" alt="ME4OO PS STORE" width="32" height="32"><b>ME4OO PS STORE</b></div>
<div id="wrap">
  <h2 style="color: yellow; margin: 0 0 15px 0;">امانه عليك تصلي على حبيبك النبي</h2>
  <div id="state">⏳ جاري فحص إصدار النظام...</div>
  <div id="det"></div>
  <div id="cache"></div>
  <div style="color: #25D366; font-size: 18px; font-weight: bold; margin-top: 40px;">💬 للدعم الفني للمحل: 01002342554</div>
</div>

<script>
(function () {
    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");
    function setState(t, c) { stateEl.textContent = t; stateEl.className = c || ""; }
    function setCache(t, ok) { cacheEl.textContent = t; cacheEl.className = ok ? "cacheok" : ""; }
    var params = new URLSearchParams(location.search);

    // إضافة توافق نظام 13.00 (1300) لتخطي حظر السورس الأصلي والسماح له بالتشغيل الفوري والتجربة المستقرة لمتجرك
    var SUPPORTED = { 1300: 1, 1302: 1, 1304: 1, 1350: 1, 1352: 1 };

    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var ms = parseInt(m[2], 16).toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }

    // قبول أي نظام 13.52 فما دون بناءً على رغبتك في التوسيع البرمجي
    var forced = params.get("force") === "1";
    var supported = forced || (fwnum !== null && (SUPPORTED[fwnum] === 1 || fwnum <= 1352));
    
    detEl.innerHTML = "إصدار السوفتوير الحالي للمنصة: <b>" + (key || "unknown") + "</b>"
        + (supported ? " &middot; <b class='ok'>مدعوم ومستقر كلياً</b>"
                     : " &middot; ليس في جدول أنوية هذا البناء البرمجي");

    var target = "jb.html" + location.search;
    function go() { setState("🚀 جاري بدء تشغيل الـ Jailbreak وحقن الـ GoldHEN المحدث...", "ok"); location.replace(target); }

    function waitForTap(msg, action) {
        setState(msg, "warn");
        function fire() {
            window.removeEventListener("click", fire);
            window.removeEventListener("keydown", fire);
            action();
        }
        window.addEventListener("click", fire);
        window.addEventListener("keydown", fire);
    }

    if (!supported) {
        setState("❌ نظام غير مدعوم حالياً", "bad");
        waitForTap("إصدار غير معروف (" + (key || "unknown") + ") -- اضغط على زر X لتخطي الفحص والتشغيل", go);
        return;
    }

    // منظومة التخزين الأوفلاين والاستقرار لمنع تجميد المعالج والكراش
    var ac = window.applicationCache;
    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        go();
    } else if (!navigator.onLine) {
        setCache("✅ تم تحميل البيانات بنجاح أوفلاين (بدون إنترنت).", true);
        go();
    } else if (ac.status === ac.IDLE) {
        setCache("✅ ملفات الكاش جاهزة ومحدثة تماماً.", true);
        go();
    } else if (ac.status === ac.UPDATEREADY) {
        try { ac.swapCache(); } catch (e) {}
        setCache("🔄 تم تحميل التحديثات بنجاح.", true);
        waitForTap("التحديث جاهز -- اضغط X لإعادة تحميل الصفحة وتشغيل الهوست الجديد",
                   function () { location.reload(); });
    } else {
        setCache("⏳ جاري التحقق من التخزين المؤقت للمتصفح...");
        ac.addEventListener("downloading",
            function () { setCache("📥 جاري تثبيت كاش الملفات أوفلاين للمرة الأولى (حماية من الكراش)..."); }, false);
        ac.addEventListener("progress", function (e) {
            if (e && e.total)
                setCache("📥 جاري التثبيت وحفظ البيانات: " + Math.round((e.loaded / e.total) * 100) + "%");
        }, false);
        ac.addEventListener("cached", function () {
            setCache("✅ تم حفظ كاش المتجر أوفلاين كلياً داخل المنصة.", true);
            waitForTap("اكتمل التثبيت بنجاح -- اضغط X لبدء التفعيل المستقر للثغرة", go);
        }, false);
        ac.addEventListener("updateready", function () {
            try { ac.swapCache(); } catch (e) {}
            setCache("🔄 تم تنزيل التعديل الجديد كلياً.", true);
            waitForTap("الملفات جاهزة -- اضغط X لإنعاش السورس والتشغيل الآمن",
                       function () { location.reload(); });
        }, false);
        ac.addEventListener("noupdate", function () {
            setCache("✅ ملفات الكاش مستقرة أوفلاين ومحمية.", true);
            go();
        }, false);
        ac.addEventListener("error", function () {
            setCache("⚠️ الكاش المحلي غير متصل (يعمل عبر الشبكة حالياً).");
            waitForTap("فشل الاتصال بالكاش -- اضغط X للتشغيل المباشر", go);
        }, false);
        ac.addEventListener("obsolete", function () {
            setCache("⚠️ ملفات الكاش القديمة منتهية الصلاحية.");
            waitForTap("كاش قديم -- اضغط X للإنعاش وبدء العمل على البناء الجديد", go);
        }, false);
    }
})();
</script>
</body>
</html>
